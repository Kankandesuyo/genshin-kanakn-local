<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>祈愿记录 · 抽卡统计</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#285978;color:#64523e;font:16px/1.6 "Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer}button:disabled{cursor:default;opacity:.45}main{max-width:1040px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;color:#eaf5fc;gap:16px;margin-bottom:18px}.top h1{font-size:26px;margin:0;letter-spacing:2px}.top p{margin:0;font-size:13px;color:#c0d8e7}.refresh{background:#ffffff18;color:#fff;border:1px solid #ffffff55;border-radius:8px;padding:7px 18px}.overview,.history{background:#f4edd9;border:1px solid #e5d8b5;border-radius:14px;padding:22px;margin-bottom:20px;box-shadow:0 9px 25px #092b4420}.ribbon{background:#35ad6a;color:white;padding:8px 24px;font-size:22px;font-weight:bold;display:inline-block;clip-path:polygon(0 0,94% 0,100% 50%,94% 100%,0 100%);padding-right:42px;margin-left:-26px;margin-bottom:18px}.totals{font-size:14px;margin:0 0 16px;color:#84755d}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.pool-card{border:2px solid transparent;background:#fffbf2;color:#6a5540;border-radius:9px;padding:16px 8px;min-width:0}.pool-card.active{border-color:#c59c43;background:#fff8e5;box-shadow:0 0 0 2px #c59c4315}.pool-card:hover{border-color:#d2b67c}.pool-label{font-size:19px;font-weight:bold}.pool-count{font-size:36px;font-weight:bold;line-height:1.4}.unit{font-size:14px;margin-left:4px}.card-stats{display:flex;justify-content:center;gap:16px;margin-top:13px}.card-stats b{display:block;font-size:20px;font-weight:normal}.card-stats small{font-size:12px;color:#9b8b71}.pity-note{font-size:12px;color:#9b8b71;margin-top:10px}.history-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}h2{font-size:23px;margin:0;font-weight:normal}.toggle{border:1px solid #d2c4a5;border-radius:6px;background:#fff9eb;color:#756047;padding:6px 13px}.explain{font-size:13px;color:#9a8a70;margin:0 0 16px}.pull-row{display:grid;grid-template-columns:62px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid #e6ddc7;align-items:center}.portrait{width:62px;height:62px;background:linear-gradient(145deg,#a67c4c,#e7cc81);border:1px solid #d2b473;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:bold;color:#fff7e6;text-shadow:0 1px 3px #5d3e2d;text-align:center;line-height:1.2}.portrait.pending{background:linear-gradient(145deg,#a29170,#dfcfaa);font-size:36px}.bar-space{min-width:0}.bar{min-height:39px;display:flex;align-items:center;gap:10px;padding:4px 12px;border-radius:5px;background-color:var(--bar-color);background-image:repeating-linear-gradient(110deg,transparent 0,transparent 17px,#ffffff16 17px,#ffffff16 33px);color:#fff;font-size:23px;font-weight:bold;white-space:nowrap;min-width:98px;max-width:100%;box-shadow:inset 0 0 0 1px #ffffff30}.bar small{font-size:13px;font-weight:normal}.bar-meta{font-size:13px;color:#958369;margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}.year{background:#e4dcc7;margin:16px -22px 0;padding:3px 22px;font-size:14px;color:#958670}.empty{text-align:center;color:#9d8c70;padding:32px 0}.error{color:#9b523e}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:11px 8px;text-align:left;border-bottom:1px solid #e4dac4}th{color:#8b785b}.s5{color:#a17522;font-weight:bold}.s4{color:#8e63a4}.s3{color:#5f8498}.pager{display:flex;justify-content:center;gap:14px;align-items:center;margin-top:18px}.pager button{background:#fff8e9;border:1px solid #d2c3a2;border-radius:6px;padding:5px 14px}.foot{color:#c6deec;font-size:12px;text-align:center;padding-bottom:12px}[hidden]{display:none!important}@media(max-width:600px){body{padding:12px}.overview,.history{padding:16px 12px}.cards{gap:6px}.pool-card{padding:12px 2px}.pool-label{font-size:16px}.pool-count{font-size:27px}.card-stats{gap:8px}.card-stats b{font-size:16px}.card-stats small{font-size:10px}.pity-note{font-size:10px}.ribbon{margin-left:-16px;font-size:19px}.top h1{font-size:22px}.top p{font-size:11px}.pull-row{grid-template-columns:48px 1fr;gap:10px}.portrait{width:48px;height:48px;font-size:17px}.bar{font-size:20px;padding:4px 9px}.year{margin-left:-12px;margin-right:-12px;padding-left:12px}h2{font-size:20px}.bar-meta{font-size:11px}.history-head{align-items:start}.toggle{font-size:12px}}
@media(max-width:480px){.cards{grid-template-columns:repeat(2,1fr)}.pool-count{white-space:nowrap}.card-stats small{white-space:nowrap}.pool-card{padding:12px 7px}.card-stats{gap:24px}.pity-note{font-size:12px}}
</style><main>
<header class="top"><div><h1>祈愿记录</h1><p>每一次出金，都有迹可循</p></div><button class="refresh" id="refresh">刷新记录</button></header>
<section class="overview"><div class="ribbon">我的抽卡统计</div><p class="totals" id="totals">正在读取四类卡池统计…</p><div class="cards" id="cards"></div></section>
<section class="history"><div class="history-head"><h2 id="poolName">角色池抽卡记录</h2><button class="toggle" id="toggle">查看全部记录</button></div><p class="explain" id="status">正在整理五星出金记录…</p>
<div id="timeline"></div><div id="allRecords" hidden><table><thead><tr><th>获得物品</th><th>星级</th><th>出金抽数</th><th>时间</th></tr></thead><tbody id="rows"></tbody></table><nav class="pager"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></nav></div>
</section><footer class="foot">基于本地服已保存记录 · 各卡池独立计数 · 首次出金从该池首条记录起统计<br>绿条 ≤ 40 抽 · 金条 41～70 抽 · 红条 ≥ 71 抽；颜色仅表示抽数区间。</footer></main>
<style>.portrait{position:relative;overflow:hidden}.portrait img{width:100%;height:100%;object-fit:cover;display:block}</style>
<script src="/gacha/mappings"></script>
<script>
const itemNames=__ITEM_NAMES__;
const records='{{REPLACE_RECORDS}}';
const maxPage='{{REPLACE_MAXPAGE}}';
const summary='{{REPLACE_SUMMARY}}';
const params=new URLSearchParams(location.search);
const selected=Number(params.get('gachaType'))||301;
const pools=[{id:301,name:'角色',label:'角色池',hard:90},{id:302,name:'武器',label:'武器池',hard:80},{id:500,name:'集录',label:'全角色混合池',hard:80},{id:200,name:'常驻',label:'常驻池',hard:90}];
const cache=new Map();let current=selected;let allMode=false;let page=0;
function describe(id){return itemNames[String(id)]||['物品 '+id,0]}
function el(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;if(cls==='portrait'){const match=Object.keys(window.gachaPortraits||{}).find(id=>describe(id)[0].slice(0,2)===text);if(match){const image=document.createElement('img');image.src=window.gachaPortraits[match];image.alt=describe(match)[0];image.onerror=()=>{node.textContent=text};node.textContent='';node.appendChild(image)}}return node}
function date(time){return new Date(time).toLocaleString('zh-CN',{hour12:false})}
function color(count){return count<=40?'#3fbd57':count<=70?'#e4b844':'#ef775a'}
function extract(html,key){const marker='const '+key+'=';const start=html.indexOf(marker);if(start<0)throw Error('记录格式不正确');return JSON.parse(html.slice(start+marker.length).split(';',1)[0])}
async function fetchPage(type,p){const url=new URL('/gacha',location.origin);url.searchParams.set('s',params.get('s')||'');url.searchParams.set('gachaType',type);url.searchParams.set('p',p);const response=await fetch(url.href,{cache:'no-store'});if(!response.ok)throw Error(response.status===403?'登录已过期，请关闭记录后重新打开':'记录读取失败，请刷新重试');const html=await response.text();return {records:extract(html,'records'),maxPage:extract(html,'maxPage'),summary:extract(html,'summary')}}
function makeCards(){const cards=document.getElementById('cards');for(const pool of pools){const button=el('button','pool-card');button.id='pool-'+pool.id;button.type='button';button.setAttribute('aria-label','查看'+pool.label);button.onclick=()=>{current=pool.id;page=0;render()};button.appendChild(el('div','pool-label',pool.name));button.appendChild(el('div','pool-count','—'));const stats=el('div','card-stats');for(const label of ['五星数','五星平均']){const part=el('div');part.appendChild(el('b','','—'));part.appendChild(el('small','',label));stats.appendChild(part)}button.appendChild(stats);button.appendChild(el('div','pity-note','读取中'));cards.appendChild(button)}}
function updateCards(){let total=0,golds=0,completed=0;for(const pool of pools){const node=document.getElementById('pool-'+pool.id);node.className='pool-card'+(current===pool.id?' active':'');node.setAttribute('aria-pressed',String(current===pool.id));const data=cache.get(pool.id);if(!data)continue;const info=data.summary;total+=info.total;golds+=info.fiveStars;completed++;node.querySelector('.pool-count').textContent=info.total+' 抽';const values=node.querySelectorAll('.card-stats b');values[0].textContent=info.fiveStars;values[1].textContent=info.fiveStars?((info.total-info.sinceLastFive)/info.fiveStars).toFixed(1):'—';node.querySelector('.pity-note').textContent='已垫 '+info.sinceLastFive+' 抽'}document.getElementById('totals').textContent=`已记录 ${total} 抽 · 共 ${golds} 个五星 · 折合 ${new Intl.NumberFormat('zh-CN').format(total*160)} 原石${completed<4?'（其余卡池读取中）':''}`}
function addBar(container,name,count,time,pending,first){const row=el('div','pull-row');const icon=el('div','portrait'+(pending?' pending':''),pending?'?':name.slice(0,2));icon.title=name;row.appendChild(icon);const space=el('div','bar-space');const bar=el('div','bar',count+' 抽');bar.style.setProperty('--bar-color',color(count));bar.style.width=Math.max(16,Math.min(100,count/(pools.find(p=>p.id===current).hard)*100))+'%';space.appendChild(bar);const note=el('div','bar-meta');note.appendChild(el('span','',pending?'尚未出金 · 当前已垫抽数':name));if(time)note.appendChild(el('span','',date(time)));if(first)note.appendChild(el('span','','首条记录起'));space.appendChild(note);row.appendChild(space);container.appendChild(row)}
function render(){updateCards();const pool=pools.find(p=>p.id===current)||pools[0];document.getElementById('poolName').textContent=pool.label+'抽卡记录';document.getElementById('toggle').textContent=allMode?'只看五星记录':'查看全部记录';document.getElementById('timeline').hidden=allMode;document.getElementById('allRecords').hidden=!allMode;const data=cache.get(current);const timeline=document.getElementById('timeline');timeline.replaceChildren();const rows=document.getElementById('rows');rows.replaceChildren();if(!data){document.getElementById('status').textContent='正在读取这个卡池…';return}document.getElementById('status').textContent=data.ready?'每条横条对应一个五星；顶部问号显示当前已垫抽数。':'统计已读取，正在加载完整出金时间线…';if(data.error)document.getElementById('status').textContent=data.error;
if(!data.summary.total){timeline.appendChild(el('div','empty','这个卡池还没有抽取记录。'))}else{addBar(timeline,'尚未出金',data.summary.sinceLastFive,null,true,false);let year='';for(const record of data.records.filter(r=>r.stars===5)){const y=new Date(record.time).getFullYear();if(String(y)!==year){timeline.appendChild(el('div','year',y+' 年'));year=String(y)}addBar(timeline,describe(record.item)[0],record.pullsToFive,record.time,false,record.fromFirstRecord)}}
for(const record of data.records.slice(page*10,page*10+10)){const info=describe(record.item);const tr=el('tr','s'+record.stars);for(const text of [info[0],record.stars+' 星',record.stars===5?record.pullsToFive+' 抽出金':'—',date(record.time)])tr.appendChild(el('td','',text));rows.appendChild(tr)}const pages=Math.ceil(data.records.length/10);document.getElementById('page').textContent=pages?`第 ${page+1} / ${pages} 页`:'暂无记录';document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page+1>=pages}
async function loadPool(pool){let first;try{first=pool.id===selected&&Number(params.get('p')||0)===0?{records,maxPage,summary}:await fetchPage(pool.id,0);const data={summary:first.summary,records:first.records,ready:first.maxPage<=1};cache.set(pool.id,data);render();const pages=new Array(first.maxPage);pages[0]=first.records;let next=1;async function worker(){while(next<first.maxPage){const p=next++;pages[p]=(await fetchPage(pool.id,p)).records}}await Promise.all([worker(),worker(),worker()]);data.records=pages.flat();data.ready=true;if(data.records.length!==data.summary.total)data.error='抽卡数据有更新，请点右上角刷新。';render()}catch(error){const data=cache.get(pool.id)||{summary:{total:0,fiveStars:0,sinceLastFive:0},records:[]};data.error=error.message;data.ready=false;cache.set(pool.id,data);render()}}
document.getElementById('toggle').onclick=()=>{allMode=!allMode;page=0;render()};document.getElementById('prev').onclick=()=>{page--;render()};document.getElementById('next').onclick=()=>{page++;render()};document.getElementById('refresh').onclick=()=>location.reload();
makeCards();render();Promise.all(pools.map(loadPool));
</script></html>
